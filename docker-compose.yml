name: zayden

x-images:
  bot: &bot-image "ghcr.io/viridianlink/zayden-bot:${IMAGE_TAG:-latest}"
  web: &web-image "ghcr.io/viridianlink/zayden-web:${IMAGE_TAG:-latest}"

services:
  bot:
    image: *bot-image
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
      # Check env.example for the other env vars
    volumes:
      - ./bots/zayden/config.toml:/app/config.toml:ro
      - palworld_uploads:/app/palworld_uploads
      # - ./secrets/youtube-cookies.txt:/app/secrets/youtube-cookies.txt:ro
    mem_reservation: 1g
    deploy:
      resources:
        reservations:
          memory: 1g

  web:
    image: *web-image
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3100:3000"
    volumes:
      - ./bots/zayden/config.toml:/app/config.toml:ro

volumes:
  palworld_uploads:
